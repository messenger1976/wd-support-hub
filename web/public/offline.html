<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#0a5f92">
	<title>Offline — WD Support Hub</title>
	<link rel="icon" href="/logo.svg" type="image/svg+xml">
	<style>
		* { box-sizing: border-box; }
		html, body { height: 100%; margin: 0; }
		body {
			display: flex;
			align-items: center;
			justify-content: center;
			padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
			background: linear-gradient(160deg, #0a5f92 0%, #063f66 100%);
			color: #fff;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
			text-align: center;
		}
		main { max-width: 22rem; }
		img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 0.75rem 2rem rgba(0, 0, 0, 0.3); }
		h1 { margin: 1.25rem 0 0.5rem; font-size: 1.4rem; }
		p { margin: 0 0 1.5rem; line-height: 1.5; opacity: 0.85; }
		button {
			min-height: 44px;
			padding: 0.6rem 1.6rem;
			border: 0;
			border-radius: 2rem;
			background: #fff;
			color: #0a5f92;
			font: inherit;
			font-weight: 600;
			cursor: pointer;
		}
	</style>
</head>
<body>
	<main>
		<img src="/icons/icon-192.png" alt="">
		<h1>You are offline</h1>
		<p>WD Support Hub needs a connection to load tickets and messages. Check your Wi-Fi or mobile data, then try again.</p>
		<button type="button" onclick="location.reload()">Try again</button>
	</main>
	<script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
